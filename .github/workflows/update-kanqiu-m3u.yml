name: Update 看球吧 M3U (hourly)
# scheduler activation bump 2026-05-20T13:50Z

on:
  schedule:
    - cron: '0 * * * *'  # 每小时整点 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-kanqiu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch 看球吧 live streams and generate M3U
        run: python scripts/kanqiu2m3u.py -o kanqiu.m3u

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f kanqiu.m3u
          if git diff --cached --quiet; then
            echo "看球吧: No changes to commit"
          else
            git commit -m "auto: update kanqiu.m3u ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git pull --rebase
            git push
          fi
