name: Update Kafeizhibo Live (hourly)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update kafeizhibo live file
        run: python scripts/update_kafeizhibo_live.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- kafeizhibo_live.m3u; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kafeizhibo_live.m3u
          git commit -m "chore: refresh kafeizhibo live"
          git pull --rebase
          git push
