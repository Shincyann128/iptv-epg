name: Update Kafeizhibo Live (hourly)
# scheduler reactivation + split from kqt to avoid push race 2026-05-20T14:15Z

on:
  schedule:
    - cron: '10 * * * *'  # 每小时 UTC:10，错开避免 push 冲突
  workflow_dispatch:

permissions:
  contents: write


jobs:
  update-kafeizhibo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update kafeizhibo live file
        run: python scripts/update_kafeizhibo_live.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kafeizhibo_live.m3u
          if git diff --cached --quiet; then
            echo "咖啡直播: No changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh kafeizhibo live ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git pull --rebase
          git push
