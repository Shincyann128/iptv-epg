name: Update 看球通 M3U

on:
  schedule:
    - cron: '0 * * * *'  # 每小时整点
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch live rooms and generate M3U
        run: python scripts/kqt_m3u.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "看球通.m3u"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: update 看球通.m3u ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git pull --rebase
            git push
          fi
