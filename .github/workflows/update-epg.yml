name: update-epg

on:
  schedule:
    - cron: '10 0 * * *'  # 北京时间每天 08:10
  workflow_dispatch:
  repository_dispatch:
    types: [myself-updated]

concurrency:
  group: update-epg
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout public EPG repo
        uses: actions/checkout@v4

      - name: Checkout private IPTV repo
        uses: actions/checkout@v4
        with:
          repository: Shincyann128/iptv
          token: ${{ secrets.IPTV_REPO_PAT }}
          path: iptv-private

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install --quiet pytest

      - name: Verify channel map matches current myself.m3u
        run: python scripts/check_playlist_sync.py --playlist iptv-private/myself.m3u --require-exact

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build EPG
        run: python scripts/build_epg.py

      - name: Verify output
        run: |
          test -s epg/epg.xml
          test -s epg/epg.xml.gz

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg/epg.xml epg/epg.xml.gz
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh EPG"
          git push
